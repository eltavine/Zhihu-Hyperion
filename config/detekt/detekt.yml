# Formatting is ktlint's job. detekt only runs rules that guard a bug class we have hit, so an upgrade of this alpha
# tool cannot fail the build over unrelated style rules.

coroutines:
  active: true
  # A catch of Exception/Throwable or a runCatching around a suspend call also catches CancellationException. When the
  # composition that launched the coroutine goes away, users then see "加载失败: The coroutine scope left the
  # composition" and the cancelled work keeps running. Rethrow it with `catch (e: CancellationException) { throw e }`.
  SuspendFunSwallowedCancellation:
    active: true
