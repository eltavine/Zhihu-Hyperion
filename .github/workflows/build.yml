name: Nightly

# Every push to master publishes a signed nightly under the moving nightly tag: the APKs, the desktop packages
# and the update.json the app reads. A newer push waits for a running publish instead of cancelling it, because
# cancelling halfway would leave the nightly release half replaced. Documentation-only pushes publish nothing.
on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".agents/**"
      - ".claude/**"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Package
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/package.yml
    # A reusable workflow's job only sees the secrets its caller passes, environment secrets included; without
    # this the android-signing job gets empty values. package.yml runs only for master and reads only the signing keys.
    secrets: inherit

  publish:
    name: Publish nightly
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # Build provenance attestations: a Sigstore certificate for the workflow's identity, recorded on the repository.
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Choose the commits for the notes
        id: range
        run: |
          set -euo pipefail

          last_release="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
          if [ -n "${last_release}" ]; then
            echo "range=${last_release}..HEAD" >> "$GITHUB_OUTPUT"
            echo "intro=自 ${last_release} 以来的变更：" >> "$GITHUB_OUTPUT"
          else
            echo "range=HEAD~50..HEAD" >> "$GITHUB_OUTPUT"
            echo "intro=最近的变更：" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --strip all --output ${{ runner.temp }}/changes.md ${{ steps.range.outputs.range }}

      - name: Write the release notes, update manifest and checksums
        id: manifest
        env:
          INTRO: ${{ steps.range.outputs.intro }}
        run: |
          set -euo pipefail

          notes="${RUNNER_TEMP}/notes.md"
          { echo "${INTRO}"; echo; cat "${RUNNER_TEMP}/changes.md"; } > "${notes}"
          python3 .github/scripts/write_update_manifest.py \
            --dist dist \
            --repository "${GITHUB_REPOSITORY}" \
            --tag nightly \
            --commit "${GITHUB_SHA}" \
            --notes "${notes}"
          rm dist/build-info.json
          (cd dist && sha256sum zhihu-hyperion-* mapping-lite.zip > SHA256SUMS.txt)
          echo "notes=${notes}" >> "$GITHUB_OUTPUT"
          echo "title=Nightly $(jq -r .versionName dist/update.json) ($(jq -r .versionCode dist/update.json))" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/zhihu-hyperion-*

      # The new nightly is a draft until every asset is uploaded; only then is the old release removed and the draft
      # published under the nightly tag, so clients go without a nightly for seconds instead of the whole upload.
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.manifest.outputs.title }}
          NOTES: ${{ steps.manifest.outputs.notes }}
        run: |
          set -euo pipefail

          # Drafts left behind by runs that failed before publishing.
          gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft and (.tagName | startswith("nightly-staging-"))) | .tagName' \
            | xargs -r -n 1 gh release delete --yes

          staging="nightly-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "${staging}" dist/* \
            --draft --prerelease --target "${GITHUB_SHA}" --title "${TITLE}" --notes-file "${NOTES}"

          if gh release view nightly > /dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly"
          fi
          gh release edit "${staging}" --tag nightly --target "${GITHUB_SHA}" --draft=false --prerelease --latest=false

      - name: Verify the published update manifest
        run: |
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/update.json" \
            | cmp - dist/update.json
