name: Release

# Publishes the current master as a stable release. Signing is only possible on master, so a release is never
# built from a pushed tag: this workflow builds master and then creates the v<app.versionName> tag on exactly
# that commit. It refuses to run elsewhere or to reuse an existing tag; bump app.versionName first.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Check the release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Require master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Releases are published from master only." >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release tag
        id: tag
        run: |
          set -euo pipefail

          version="$(sed -n 's/^app\.versionName=//p' gradle.properties)"
          tag="v${version}"
          if ! git check-ref-format "refs/tags/${tag}"; then
            echo "app.versionName '${version}' does not form a valid tag." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; bump app.versionName before releasing." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  package:
    name: Package
    needs: prepare
    uses: ./.github/workflows/package.yml
    # A reusable workflow's job only sees the secrets its caller passes, environment secrets included; without
    # this the android-signing job gets empty values. package.yml runs only for master and reads only the signing keys.
    secrets: inherit

  publish:
    name: Publish release
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG,
              target_commitish: context.sha,
            });
            require('fs').writeFileSync(`${process.env.RUNNER_TEMP}/notes.md`, data.body);

      - name: Write update manifest and release body
        run: |
          set -euo pipefail

          python3 .github/scripts/write_update_manifest.py \
            --dist dist \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${TAG}" \
            --commit "${GITHUB_SHA}" \
            --notes "${RUNNER_TEMP}/notes.md"

          {
            echo 'Android 请下载 APK 安装：Full 版带端侧语义模型，支持智能内容过滤；Lite 版体积更小。mapping-lite.zip 只用于分析混淆后的崩溃。'
            echo '桌面端提供内置 Java 运行时的 Windows MSI 与 Linux AppImage，macOS 为 Apple Silicon 原生应用。'
            echo 'iOS 的 IPA 没有签名，需要先用 AltStore、SideStore、Sideloadly 或自己的开发者证书签名再安装。'
            echo
            cat "${RUNNER_TEMP}/notes.md"
          } > "${RUNNER_TEMP}/body.md"

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          body_path: ${{ runner.temp }}/body.md
          make_latest: "true"
          files: |
            dist/update.json
            dist/zhihu-hyperion-lite.apk
            dist/zhihu-hyperion-full.apk
            dist/mapping-lite.zip
            dist/zhihu-hyperion-desktop-*.AppImage
            dist/zhihu-hyperion-desktop-*.msi
            dist/zhihu-hyperion-desktop-*.app.zip
            dist/zhihu-hyperion-ios-*.ipa
          fail_on_unmatched_files: true

      - name: Verify the published update manifest
        run: |
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/update.json" \
            | cmp - dist/update.json
