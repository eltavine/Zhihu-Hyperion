name: Release

# Publishes master as a stable release in one run: set app.versionName to the given version (committing it to master
# when it differs), build that exact commit, then create the v<version> tag on it. Signing is only possible on master,
# so a release is never built from a pushed tag. It refuses to run elsewhere or to reuse an existing tag.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 版本号，例如 1.0.0 或 1.1.0-beta.1
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare the release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Pushes the version commit to master.
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Require master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Releases are published from master only." >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate the version
        id: version
        env:
          VERSION: ${{ inputs.version_name }}
        run: |
          set -euo pipefail

          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "version_name must be X.Y, X.Y.Z or a pre-release such as 1.0.0-beta.1." >&2
            exit 1
          fi
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already exists." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # versionCode follows the commit count, so only the name needs a commit. GITHUB_TOKEN pushes do not start other
      # workflows, which keeps the nightly from racing this release.
      - name: Commit the version
        id: commit
        env:
          VERSION: ${{ inputs.version_name }}
        run: |
          set -euo pipefail

          sed -i "s/^app\.versionName=.*/app.versionName=${VERSION}/" gradle.properties
          if ! git diff --quiet -- gradle.properties; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "chore: 版本号改为 ${VERSION}" -- gradle.properties
            git push origin HEAD:master
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    name: Package
    needs: prepare
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    # A reusable workflow's job only sees the secrets its caller passes, environment secrets included; without
    # this the android-signing job gets empty values. package.yml runs only for master and reads only the signing keys.
    secrets: inherit

  publish:
    name: Publish release
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Choose the commits for the notes
        id: range
        run: |
          set -euo pipefail

          previous="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
          if [ -n "${previous}" ]; then
            echo "range=${previous}..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=HEAD~50..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --strip all --output ${{ runner.temp }}/changes.md ${{ steps.range.outputs.range }}

      - name: Write the update manifest, release body and checksums
        run: |
          set -euo pipefail

          python3 .github/scripts/write_update_manifest.py \
            --dist dist \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${TAG}" \
            --commit "${SHA}" \
            --notes "${RUNNER_TEMP}/changes.md"
          rm dist/build-info.json
          (cd dist && sha256sum zhihu-hyperion-* mapping-lite.zip > SHA256SUMS.txt)

          {
            cat <<'EOF'
          Android 请下载 APK 安装：Full 版带端侧语义模型，支持智能内容过滤；Lite 版体积更小。mapping-lite.zip 只用于分析混淆后的崩溃。
          桌面端提供内置 Java 运行时的 Windows MSI 与 Linux AppImage，macOS 为 Apple Silicon 原生应用。

          下载后可以用 `SHA256SUMS.txt` 核对文件，或用 `gh attestation verify <文件> --repo eltavine/Zhihu-Hyperion` 确认它由本仓库的发布流程构建。

          EOF
            cat "${RUNNER_TEMP}/changes.md"
          } > "${RUNNER_TEMP}/body.md"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/zhihu-hyperion-*

      # The stable channel reads releases/latest, which GitHub never points at a pre-release such as 1.1.0-beta.1.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${TAG}" == *-* ]]; then
            channel=(--prerelease --latest=false)
          else
            channel=(--latest)
          fi
          gh release create "${TAG}" dist/* \
            --target "${SHA}" --title "${TAG}" --notes-file "${RUNNER_TEMP}/body.md" "${channel[@]}"

      - name: Verify the published update manifest
        run: |
          set -euo pipefail

          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/update.json"
          if [[ "${TAG}" == *-* ]]; then
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/update.json"
          fi
          curl -fsSL --retry 5 --retry-all-errors "${url}" | cmp - dist/update.json
