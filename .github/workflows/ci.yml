name: CI

# Every check runs here without any secret. No job references the android-signing environment, and that
# environment only admits master, so code from a pull request cannot reach the release signing key.
#
# Pushes to master run the same checks because commits can land there without a pull request; other branches
# are checked through their pull requests only, so one commit is never verified twice.
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Documentation-only changes skip every build; "CI result" still reports, so it can stay a required check.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only pull requests are filtered by path. A newer push to master cancels the run of the previous one, and the
    # surviving run would only see its own push, so master and manual runs always run everything.
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.code.outputs.code == 'true' }}
      instrumented: ${{ github.event_name != 'pull_request' || steps.instrumented.outputs.instrumented == 'true' }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect code changes
        if: github.event_name == 'pull_request'
        id: code
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A file counts as code unless one of the exclusions matches it.
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"
              - "!.agents/**"
              - "!.claude/**"
              - "!.github/ISSUE_TEMPLATE/**"
              - "!LICENSE"

      - name: Detect changes that need instrumented tests
        if: github.event_name == 'pull_request'
        id: instrumented
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            instrumented:
              - "app/**"
              - "shared/**"
              - "core/**"
              - "feature/**"
              - "third_party/**"
              - "build-logic/**"
              - ".github/actions/**"
              - ".github/scripts/run-instrumented-shard.sh"
              - ".github/workflows/ci.yml"
              - "build.gradle.kts"
              - "settings.gradle.kts"
              - "gradle.properties"
              - "gradle/**"

  checks:
    name: KtLint, ABI and module graph
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # versionCode counts commits, so every Gradle build needs the full history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build

      - name: Run KtLint, ABI and module graph checks
        run: ./gradlew ktlintCheck checkKotlinAbi :app:assertModuleGraph :desktopApp:assertModuleGraph :macosApp:assertModuleGraph :macosUiDebug:assertModuleGraph :iosApp:assertModuleGraph

      - name: Verify the update manifest contract
        run: python3 .github/scripts/test_write_update_manifest.py

      - name: Verify the vendored icons match symbols.txt
        run: python3 core/icons/symbols.py --check

  unit-tests:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build

      - name: Run unit tests
        run: ./gradlew jvmUnitTests

      - name: Verify committed Room schemas
        run: |
          changes="$(git status --porcelain -- '*/schemas')"
          if [[ -n "$changes" ]]; then
            echo "Room schemas changed; commit the regenerated files under */schemas:" >&2
            echo "$changes" >&2
            exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android Lite debug build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          android-sdk: "true"

      - name: Build Lite APKs
        env:
          RUN_INSTRUMENTED_TESTS: ${{ needs.changes.outputs.instrumented }}
        run: |
          tasks=(assembleLiteDebug)
          if [[ "$RUN_INSTRUMENTED_TESTS" == "true" ]]; then
            tasks+=(:app:assembleLiteDebugAndroidTest)
          fi
          ./gradlew "${tasks[@]}" --max-workers=2

      - name: Prepare Lite debug APK
        run: |
          mkdir -p app/build/upload
          cp app/build/outputs/apk/lite/debug/app-lite-debug.apk app/build/upload/zhihu-hyperion-lite-debug.apk

      - name: Upload Lite debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lite-debug-apk
          path: app/build/upload/
          retention-days: 7

      - name: Prepare instrumented test APKs
        if: needs.changes.outputs.instrumented == 'true'
        run: |
          mkdir -p app/build/instrument-apks
          cp app/build/outputs/apk/lite/debug/app-lite-debug.apk app/build/instrument-apks/app.apk
          cp app/build/outputs/apk/androidTest/lite/debug/app-lite-debug-androidTest.apk app/build/instrument-apks/test.apk

      - name: Upload instrumented test APKs
        if: needs.changes.outputs.instrumented == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-apks
          path: app/build/instrument-apks/
          retention-days: 1

  desktop:
    name: Desktop release package
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build

      - name: Build desktop release package
        run: ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS --max-workers=2

  ios:
    name: iOS simulator debug build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          kotlin-native: "true"

      - name: Verify the Xcode project matches project.yml
        run: |
          xcodegen_version="2.46.0"
          xcodegen_sha256="4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$xcodegen_version/xcodegen.zip"
          printf '%s  %s\n' "$xcodegen_sha256" "$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check --status -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec iosApp/project.yml --quiet
          if [ -n "$(git status --porcelain -- iosApp)" ]; then
            echo "::error::iosApp/ZhihuHyperion.xcodeproj is out of date; run xcodegen generate --spec iosApp/project.yml and commit the result."
            git status --short -- iosApp
            git diff -- iosApp
            exit 1
          fi

      # Each Release iOS build took 27–39 minutes on this runner, so pull requests build Debug;
      # package.yml builds the Release IPA.
      - name: Build the simulator app
        run: >-
          xcodebuild -project iosApp/ZhihuHyperion.xcodeproj -scheme ZhihuHyperion -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath iosApp/build/derived-data build

  instrumented-tests:
    name: Mock instrumented shard (${{ matrix.shard_label }}/5)
    if: needs.changes.outputs.instrumented == 'true'
    needs: [changes, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - shard_index: 0
            shard_label: 1
          - shard_index: 1
            shard_label: 2
          - shard_index: 2
            shard_label: 3
          - shard_index: 3
            shard_label: 4
          - shard_index: 4
            shard_label: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download instrumented test APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: instrumented-test-apks
          path: app/build/instrument-apks

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # 默认的 tools 包已无法安装；失败记录：https://github.com/zly2006/zhihu-plus-plus/actions/runs/35182179380/job/105076511639
          packages: platform-tools

      # The emulator runner downloads the emulator package itself and fails the shard on a broken download; installing
      # it first with retries leaves the runner nothing to download.
      - name: Install the emulator package
        run: |
          for attempt in 1 2 3; do
            if sdkmanager --install emulator > /dev/null; then
              exit 0
            fi
            echo "Installing the emulator package failed (attempt ${attempt}); retrying." >&2
            sleep 15
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run mock-mode androidTest on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          INSTRUMENT_APP_APK: app/build/instrument-apks/app.apk
          INSTRUMENT_TEST_APK: app/build/instrument-apks/test.apk
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run-instrumented-shard.sh 5 ${{ matrix.shard_index }}

      - name: Upload shard test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mock-instrumented-shard-${{ matrix.shard_label }}
          path: app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 7

  result:
    name: CI result
    if: always()
    needs:
      - changes
      - checks
      - unit-tests
      - android
      - desktop
      - ios
      - instrumented-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          INSTRUMENTED: ${{ needs.changes.outputs.instrumented }}
          CHECKS: ${{ needs.checks.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          ANDROID: ${{ needs.android.result }}
          DESKTOP: ${{ needs.desktop.result }}
          IOS: ${{ needs.ios.result }}
          INSTRUMENTED_TESTS: ${{ needs.instrumented-tests.result }}
        run: |
          test "$CHANGES" = success
          # Documentation-only changes skip the builds; anything else must run and pass them.
          expected=skipped
          if [[ "$CODE" == "true" ]]; then
            expected=success
          fi
          for result in "$CHECKS" "$UNIT_TESTS" "$ANDROID" "$DESKTOP" "$IOS"; do
            test "$result" = "$expected"
          done
          if [[ "$CODE" == "true" && "$INSTRUMENTED" == "true" ]]; then
            test "$INSTRUMENTED_TESTS" = success
          else
            test "$INSTRUMENTED_TESTS" = skipped
          fi
