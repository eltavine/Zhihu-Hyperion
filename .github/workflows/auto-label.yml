name: Auto Label PR

# pull_request_target runs this file as it is on master, with a token that may label the pull request. It never
# checks out the pull request's code, so nothing from the pull request can run with that token.
on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title;
            let label = null;

            if (/^feat(\(.+\))?[!:]/.test(title)) {
              label = 'enhancement';
            } else if (/^fix(\(.+\))?[!:]/.test(title)) {
              label = 'bug';
            }

            if (label) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [label],
              });
            }
