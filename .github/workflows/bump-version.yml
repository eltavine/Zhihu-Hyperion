name: Bump Version

# Sets app.versionName on master. versionCode follows the commit count and never needs a bump; run the Release
# workflow afterwards to publish the new version.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0-pre.1 or 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump:
    name: Bump app.versionName
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version_name }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Error: version_name must be X.Y, X.Y.Z, or a pre-release such as 1.0-pre.1" >&2
            exit 1
          fi

      - name: Commit the new version
        env:
          VERSION: ${{ inputs.version_name }}
        run: |
          sed -i "s/^app\.versionName=.*/app.versionName=${VERSION}/" gradle.properties
          if git diff --quiet -- gradle.properties; then
            echo "app.versionName is already ${VERSION}." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: 版本号改为 ${VERSION}"
          git push origin HEAD:master
