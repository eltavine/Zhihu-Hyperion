on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      args:
        required: false
        type: string
      minify:
        required: false
        type: boolean
      release:
        required: false
        type: boolean
      nightly_release:
        required: false
        type: boolean

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set Up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Change wrapper permissions
        shell: bash
        run: chmod +x ./gradlew

      - name: Set desktop artifact suffix
        id: desktop_suffix
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "suffix=macos-arm64" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch="x64" ;;
            aarch64|arm64) arch="arm64" ;;
          esac
          case "$RUNNER_OS" in
            Linux) os="linux" ;;
            Windows) os="windows" ;;
            *) os="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')" ;;
          esac
          echo "suffix=$os-$arch" >> "$GITHUB_OUTPUT"

      - name: Build desktop distribution
        if: runner.os != 'macOS'
        shell: bash
        run: ./gradlew ${{ inputs.args }} :desktopApp:packageReleaseDistributionForCurrentOS

      - name: Package Windows MSI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p desktopApp/build/upload
          msi="$(find desktopApp/build/compose/binaries -name '*.msi' | head -n 1)"
          test -n "$msi"
          cp "$msi" "desktopApp/build/upload/zhihu-hyperion-desktop-${{ steps.desktop_suffix.outputs.suffix }}.msi"

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p desktopApp/build/upload
          # Compose 的 TargetFormat.AppImage 只产出 jpackage 的 app-image 目录，
          # 需要再用 appimagetool 封装成单文件 .AppImage
          images_dir="$(find desktopApp/build/compose/binaries -type d -name app -mindepth 2 -maxdepth 2 | head -n 1)"
          test -n "$images_dir"
          app_dir="$(find "$images_dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -d "$app_dir/bin"

          appdir="$RUNNER_TEMP/zhihu-appdir"
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/share/icons/hicolor/512x512/apps"
          cp -a "$app_dir/." "$appdir/"

          icon_name="com.eltavine.zhihuhyperion"
          # 根目录那份是给 appimagetool 校验用的（它不认 hicolor 子目录），hicolor 那份用于安装后的桌面集成
          cp desktopApp/src/main/resources/desktop-icon.png "$appdir/$icon_name.png"
          cp desktopApp/src/main/resources/desktop-icon.png "$appdir/usr/share/icons/hicolor/512x512/apps/$icon_name.png"
          ln -s "$icon_name.png" "$appdir/.DirIcon"

          launcher_name="$(basename "$(find "$appdir/bin" -maxdepth 1 -type f -perm -u+x | head -n 1)")"
          test -n "$launcher_name"

          cat > "$appdir/zhihu-hyperion.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Zhihu-Hyperion
          Comment=自由、无广告的知乎第三方客户端
          Exec=AppRun
          Icon=$icon_name
          Terminal=false
          Categories=Network;
          EOF

          cat > "$appdir/AppRun" <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/bin/$launcher_name" "\$@"
          EOF
          chmod +x "$appdir/AppRun"

          out="desktopApp/build/upload/zhihu-hyperion-desktop-${{ steps.desktop_suffix.outputs.suffix }}.AppImage"
          abs_out="$PWD/$out"
          appimagetool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          appimagetool_version="1.9.1"
          appimagetool_sha256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          curl -fsSL -o "$appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/$appimagetool_version/appimagetool-x86_64.AppImage"
          printf '%s  %s\n' "$appimagetool_sha256" "$appimagetool" | sha256sum --check --status -
          chmod +x "$appimagetool"
          "$appimagetool" --appimage-extract-and-run "$appdir" "$abs_out"

          # 产物自检：能 --appimage-extract 说明 squashfs 完整
          (cd "$RUNNER_TEMP" && "$abs_out" --appimage-extract >/dev/null 2>&1)
          rm -rf "$RUNNER_TEMP/squashfs-root"

      - name: Upload desktop package
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}-desktop-${{ steps.desktop_suffix.outputs.suffix }}
          path: desktopApp/build/upload/*
          if-no-files-found: error

      - name: Build and package macOS Kotlin/Native app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./gradlew -Dorg.gradle.jvmargs="-Xmx5120m -Dfile.encoding=UTF-8" ${{ inputs.args }} :macosApp:packageReleaseMacosApp :macosUiDebug:verifyMacosReleaseIsolation

          app_bundle="macosApp/build/bin/macosArm64/releaseApp/Zhihu-Hyperion.app"
          app_executable="$app_bundle/Contents/MacOS/ZhihuHyperion"
          app_archive="desktopApp/build/upload/zhihu-hyperion-desktop-${{ steps.desktop_suffix.outputs.suffix }}.app.zip"
          extracted_dir="$RUNNER_TEMP/zhihu-native-release"

          test -d "$app_bundle"
          /usr/bin/file "$app_executable" | grep -q 'Mach-O 64-bit executable arm64'
          /usr/bin/codesign --verify --deep --strict "$app_bundle"

          mkdir -p desktopApp/build/upload
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app_bundle" "$app_archive"
          /usr/bin/ditto -x -k "$app_archive" "$extracted_dir"
          /usr/bin/codesign --verify --deep --strict "$extracted_dir/Zhihu-Hyperion.app"

      - name: Upload macOS Kotlin/Native app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}-desktop-${{ steps.desktop_suffix.outputs.suffix }}
          path: desktopApp/build/upload/zhihu-hyperion-desktop-${{ steps.desktop_suffix.outputs.suffix }}.app.zip

  build:
    name: Build Android App
    runs-on: ubuntu-latest
    # 发布签名密钥只放在这个环境里；可以在环境设置中限制只有 master 和标签能使用它。
    environment: android-signing
    steps:
      - uses: actions/checkout@v7
      - name: Set Up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '17'
          cache: 'gradle'
      - name: Validate signing secrets and prepare release keystore
        id: keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing_secrets=()
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              missing_secrets+=("${secret_name}")
            fi
          done
          if [ "${#missing_secrets[@]}" -ne 0 ]; then
            printf 'Missing required secrets in the android-signing environment: %s\n' \
              "$(IFS=', '; echo "${missing_secrets[*]}")" >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/release.keystore"
          if ! printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"; then
            echo "ANDROID_KEYSTORE_BASE64 is not valid base64." >&2
            exit 1
          fi
          if [ ! -s "${keystore_path}" ]; then
            echo "Decoded release keystore is empty." >&2
            exit 1
          fi
          chmod 600 "${keystore_path}"
          echo "keystore_path=${keystore_path}" >> "$GITHUB_OUTPUT"
      - name: Extract expected signing fingerprint
        id: signing_fingerprint
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          expected_sha256=$(keytool -J-Duser.language=en -J-Duser.country=US -list -v \
              -keystore "${ANDROID_KEYSTORE_PATH}" \
              -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
              -alias "${ANDROID_KEY_ALIAS}" \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | head -n 1 \
            | tr -d '[:space:]:' \
            | tr '[:upper:]' '[:lower:]')
          if [ -z "${expected_sha256}" ]; then
            echo "Failed to extract the SHA-256 fingerprint from the configured keystore." >&2
            exit 1
          fi
          echo "sha256=${expected_sha256}" >> "$GITHUB_OUTPUT"
      - name: Setup rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          override: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk || true

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Change wrapper permissions
        run: chmod +x ./gradlew
      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./rs-hf-tokenizer/target/
          key: rust-cache-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            rust-cache-
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
            ./.gradle
            ./**/.gradle
          # dont invalidate cache if only gradle.properties is changed -- they
          key: gradle-cache-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'build-logic/**/*.kt') }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 默认的 tools 包已无法安装；失败记录：https://github.com/zly2006/zhihu-plus-plus/actions/runs/35182179380/job/105076511639
          packages: platform-tools

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV
      - name: Run KtLint
        run: ./gradlew ktlintCheck
      - name: Build App
        # Build .apk
        run: |
          bash ./gradlew ${{inputs.args}} assembleFullRelease
          bash ./gradlew ${{inputs.args}} assembleLiteRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CI_BUILD_MINIFY: ${{ inputs.minify }}
      - name: Move files
        run: |
          mkdir -p app/build/upload
          mv app/build/outputs/apk/full/release/app-full-release.apk app/build/upload/zhihu-hyperion-full.apk
          mv app/build/outputs/apk/lite/release/app-lite-release.apk app/build/upload/zhihu-hyperion-lite.apk
      - name: Verify APK signatures
        shell: bash
        env:
          EXPECTED_SIGNER_SHA256: ${{ steps.signing_fingerprint.outputs.sha256 }}
        run: |
          set -euo pipefail

          build_tools_dir=$(find "${ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          for apk in app/build/upload/zhihu-hyperion-full.apk app/build/upload/zhihu-hyperion-lite.apk; do
            actual_sha256=$("${build_tools_dir}/apksigner" verify --print-certs "${apk}" \
              | sed -n '/Source Stamp/!s/^.*certificate SHA-256 digest:[[:space:]]*//p' \
              | head -n 1 \
              | tr -d '[:space:]:' \
              | tr '[:upper:]' '[:lower:]')
            if [ "${actual_sha256}" != "${EXPECTED_SIGNER_SHA256}" ]; then
              echo "${apk} was not signed with the release key." >&2
              echo "Expected: ${EXPECTED_SIGNER_SHA256}" >&2
              echo "Actual:   ${actual_sha256:-<none>}" >&2
              exit 1
            fi
          done
      - name: Compress lite mapping file
        if: ${{ inputs.minify }}
        run: |
          mkdir -p app/build/upload
          zip app/build/upload/mapping-lite.zip app/build/outputs/mapping/liteRelease/mapping.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}-android
          path: app/build/upload/
          if-no-files-found: error
      - name: Clean up signing material
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/release.keystore"

  publish:
    name: Collect and publish builds
    needs: [build-desktop, build]
    runs-on: ubuntu-latest
    steps:
      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Set repository name as env variable
        run: echo "repository_name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: Download Android apps
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.name }}-android
          path: app/build/upload

      - name: Download desktop apps
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.name }}-desktop-*
          path: app/build/upload
          merge-multiple: true

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.date_today }} - ${{ env.repository_name }} - ${{ inputs.name }}
          path: app/build/upload/
          if-no-files-found: error

      # Delete existing nightly release
      - name: Delete existing nightly release
        if: ${{ inputs.minify && inputs.nightly_release }}
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tagName = 'nightly';

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            for (const release of releases.filter(r => r.tag_name === tagName)) {
              core.info(`Deleting nightly release ${release.id} (${release.name || release.tag_name})`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tagName}`,
              });
              core.info(`Deleted tag ${tagName}`);
            } catch (error) {
              if (error.status === 422) {
                core.info(`Tag ${tagName} does not exist`);
              } else {
                throw error;
              }
            }

      # Generate nightly changelog
      - name: Generate nightly changelog
        if: ${{ inputs.minify && inputs.nightly_release }}
        id: nightly_changelog
        uses: actions/github-script@v9
        with:
          script: |
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            // Find the latest non-nightly tag
            const lastReleaseTag = tags.find(t => t.name !== 'nightly');
            let since;
            if (lastReleaseTag) {
              const { data: tagCommit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: lastReleaseTag.commit.sha,
              });
              since = tagCommit.commit.committer.date;
            } else {
              // Fallback: 24 hours ago
              since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            }

            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              since: since,
              per_page: 50,
            });

            if (commits.length === 0) {
              return 'No changes since last release.';
            }

            const lines = [];
            for (const c of commits) {
              const msg = c.commit.message.split('\n')[0];
              const sha = c.sha.substring(0, 7);
              lines.push(`- ${msg} (${sha})`);
            }

            if (lastReleaseTag) {
              return `**Changes since ${lastReleaseTag.name}:**\n\n` + lines.join('\n');
            } else {
              return `**Recent changes:**\n\n` + lines.join('\n');
            }
          result-encoding: string

      # Create new nightly release
      - name: Create Nightly Release
        if: ${{ inputs.minify && inputs.nightly_release }}
        id: nightly_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build (${{ env.date_today }})
          body: |
            Nightly build generated on ${{ env.date_today }}

            ${{ steps.nightly_changelog.outputs.result }}
          files: |
            app/build/upload/zhihu-hyperion-lite.apk
            app/build/upload/mapping-lite.zip
            app/build/upload/zhihu-hyperion-full.apk
            app/build/upload/zhihu-hyperion-desktop-*.AppImage
            app/build/upload/zhihu-hyperion-desktop-*.msi
            app/build/upload/zhihu-hyperion-desktop-*.app.zip
          fail_on_unmatched_files: true
          prerelease: true
      - name: Generate release notes
        if: ${{ inputs.release && startsWith(github.ref, 'refs/tags/') }}
        id: release_notes
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
            });
            console.log(data.body);
            return data.body;
          result-encoding: string

      - name: Create Release
        if: ${{ inputs.release && startsWith(github.ref, 'refs/tags/') }}
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            如果要使用，请下载最新的 APK 文件进行安装。不需要下载 mapping.zip，除非你是开发人员且需要调试混淆后的代码。
            桌面端提供 Windows MSI 安装包与 Linux AppImage，内置 Java 运行时，下载安装即可使用，无需另外安装 Java。
            Full 版本包含 AI 功能和 AI 模型，可处理NLP任务；Lite 版本体积更小，只有不到 4 MB 的大小。

            > 关于Full和Lite两个版本的说明：
            > Full版本包含了一个onnx框架，可以在端侧进行离线AI推理，支持基于LLM embedding的智能内容过滤功能，
            > 这实际上主要是本人对端侧AI的技术尝试，实际功能还有很多没开发的，比如人本地知识库（懒）；
            > Lite版本不支持智能内容过滤，但体积更小，性能更好。您可以根据自己的需求选择下载哪个版本。

            ${{ steps.release_notes.outputs.result }}
          files: |
            app/build/upload/zhihu-hyperion-lite.apk
            app/build/upload/mapping-lite.zip
            app/build/upload/zhihu-hyperion-full.apk
            app/build/upload/zhihu-hyperion-desktop-*.AppImage
            app/build/upload/zhihu-hyperion-desktop-*.msi
            app/build/upload/zhihu-hyperion-desktop-*.app.zip
          fail_on_unmatched_files: true
          prerelease: false
