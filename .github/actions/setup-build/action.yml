name: Set up Gradle build
description: >
  JDK 17, Gradle with its cache and, on request, the Android SDK and the Rust toolchain that the Full
  flavor's tokenizer needs. Every workflow that runs Gradle uses this action, so the toolchain cannot drift
  between them; the NDK version is read from gradle/libs.versions.toml like the Gradle build does.

inputs:
  cache-read-only:
    description: Restore the Gradle cache without writing it back.
    required: false
    default: "true"
  android-sdk:
    description: Install the Android SDK platform tools.
    required: false
    default: "false"
  rust:
    description: Also install Rust, cargo-ndk, the Android Rust targets and the pinned NDK.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Make Gradle wrapper executable
      shell: bash
      run: chmod +x gradlew

    - name: Set up Java 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: zulu
        java-version: "17"

    # The foojay resolver in settings.gradle.kts provisions the other toolchains the build asks for,
    # such as the JDK 21 the app's unit tests run on.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-read-only: ${{ inputs.cache-read-only }}

    - name: Set up Android SDK
      if: inputs.android-sdk == 'true' || inputs.rust == 'true'
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        # 默认的 tools 包已无法安装；失败记录：https://github.com/zly2006/zhihu-plus-plus/actions/runs/35182179380/job/105076511639
        packages: platform-tools

    - name: Install Android NDK
      if: inputs.rust == 'true'
      shell: bash
      run: |
        set -euo pipefail

        ndk="$(sed -n 's/^android-ndk = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
        if [ -z "${ndk}" ]; then
          echo "gradle/libs.versions.toml does not pin android-ndk." >&2
          exit 1
        fi
        sdkmanager --install "ndk;${ndk}"
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ndk}" >> "$GITHUB_ENV"

    - name: Set up Rust
      if: inputs.rust == 'true'
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
        cache-workspaces: rs-hf-tokenizer -> target
        # The action denies warnings by default. The tokenizer is built with whatever Rust is stable at the time,
        # so a lint added by a new release must not fail the signed build; this matches local cargo builds.
        build-warnings: warn

    - name: Install cargo-ndk
      if: inputs.rust == 'true'
      shell: bash
      run: cargo install cargo-ndk --locked
