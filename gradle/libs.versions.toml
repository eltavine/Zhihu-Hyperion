[versions]
# ---- Build toolchain ----
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
compose-multiplatform = "1.12.1"
# JetBrains material3 has no stable release on the Compose Multiplatform 1.12 line yet (latest stable is 1.9.0),
# and material-kolor 5.x declares a strict requirement on this alpha. Keep every module on the same version.
compose-material3 = "1.12.0-alpha03"
androidx-compose-bom = "2026.09.00"
aboutlibraries = "15.2.0"
ktlint-gradle = "14.2.0"
# The Gradle plugin defaults to an older engine; pin the linter itself so formatting is reproducible.
ktlint = "1.8.0"
# detekt 2.0 is the line that analyzes Kotlin 2.4 sources (1.23.x stops at Kotlin 2.0.21). It is still an alpha, so
# config/detekt/detekt.yml enables only the rules that guard a verified bug class instead of the default rule set.
detekt = "2.0.0-alpha.6"
foojay-resolver = "1.0.0"
module-graph-assertion = "2.9.1"
android-compileSdk = "37"
android-minSdk = "27"
android-targetSdk = "35"
# The Full flavor's Rust tokenizer links against this NDK; CI installs the same version.
android-ndk = "29.0.14206865"

# ---- AndroidX ----
androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-browser = "1.10.0"
androidx-core = "1.19.1"
androidx-graphics-path = "1.1.0"
androidx-lifecycle = "2.11.0"
androidx-media = "1.8.0"
androidx-media3 = "1.11.1"
androidx-navigationevent = "1.1.2"
androidx-startup = "1.2.0"
androidx-room = "2.8.5"
androidx-sqlite = "2.7.1"
androidx-test-espresso = "3.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-webkit = "1.17.1"

# ---- JetBrains multiplatform ports of AndroidX ----
jetbrains-lifecycle = "2.11.0"
jetbrains-navigation = "2.9.2"
jetbrains-navigationevent = "1.1.0"

# ---- Kotlin libraries ----
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinx-io = "0.9.1"
kotlinx-serialization = "1.11.0"

# ---- Third-party libraries ----
coil = "3.6.3"
hanlp = "portable-1.8.6"
# Desktop runtime is linked from JDK 17; JavaFX 22+ requires a newer JDK, so stay on the 21 LTS line.
javafx = "21.0.12"
jsoup = "1.23.2"
junit4 = "4.13.2"
kermit = "2.2.0"
koin = "4.2.2"
kotlincrypto-hash = "0.8.0"
kotlincrypto-macs = "0.8.0"
ksoup = "0.2.6"
ktor = "3.6.0"
material-kolor = "5.0.1"
onnxruntime = "1.30.0"
telephoto = "0.19.0"
# Maintainer-controlled dev channel: the snapshot (2026-09-20) carries renderer fixes newer than the latest
# published 0.1.0-alpha05 (2026-08-19). Pin to the next published alpha once it includes those fixes.
tiqian = "0.1.0-SNAPSHOT"
zxing-android-embedded = "4.3.0"
zxing-core = "3.5.4"

[libraries]
# ---- Gradle plugins used by build-logic ----
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
aboutlibraries-gradlePlugin = { module = "com.mikepenz.aboutlibraries.plugin:aboutlibraries-plugin", version.ref = "aboutlibraries" }
compose-multiplatform-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
room-gradlePlugin = { module = "androidx.room:room-gradle-plugin", version.ref = "androidx-room" }
ktlint-gradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
detekt-gradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
module-graph-assertion-gradlePlugin = { module = "com.jraska.module.graph.assertion:plugin", version.ref = "module-graph-assertion" }

# ---- Compose Multiplatform ----
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-graphics = { module = "org.jetbrains.compose.ui:ui-graphics", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform" }
compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "compose-multiplatform" }
compose-animation-core = { module = "org.jetbrains.compose.animation:animation-core", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }

# ---- AndroidX ----
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-graphics-path = { module = "androidx.graphics:graphics-path", version.ref = "androidx-graphics-path" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidx-lifecycle" }
androidx-media = { module = "androidx.media:media", version.ref = "androidx-media" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "androidx-media3" }
androidx-media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "androidx-media3" }
androidx-media3-ui-compose-material3 = { module = "androidx.media3:media3-ui-compose-material3", version.ref = "androidx-media3" }
androidx-navigationevent = { module = "androidx.navigationevent:navigationevent", version.ref = "androidx-navigationevent" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "androidx-startup" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }

# ---- JetBrains multiplatform ports of AndroidX ----
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrains-lifecycle" }
jetbrains-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jetbrains-lifecycle" }
jetbrains-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "jetbrains-navigation" }
jetbrains-navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "jetbrains-navigationevent" }

# ---- Kotlin libraries ----
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# ---- Networking ----
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
